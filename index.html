<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>tower defense</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="jogo">
    <div id="topo">
      <span id="ouro"></span>
      <span id="vidas"></span>
      <span id="onda"></span>
      <span id="pontos"></span>
      <span id="cliques"></span>
      <span id="situacao"></span>
      <button id="proxima">Próxima orda</button>
      <label id="controle-volume">Som <input type="range" id="volume" min="0" max="100" value="70"></label>
    </div>
    <div id="tabuleiro">
      <canvas id="game-canvas"></canvas>
      <div id="cartas" hidden>
        <p id="cartas-titulo"></p>
        <div id="cartas-lista"></div>
      </div>
      <div id="fim" hidden>
        <img id="fim-retrato" alt="">
        <h1 id="fim-titulo"></h1>
        <p id="fim-texto"></p>
        <button id="reiniciar">Jogar de novo</button>
      </div>
    </div>
    <div id="loja"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
